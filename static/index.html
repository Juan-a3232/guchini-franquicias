<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Guchini — Franquicias</title>
  <style>
    :root {
      --bg: #f5f5f0;
      --surface: #ffffff;
      --border: #e8e8e4;
      --text: #1a1a1a;
      --muted: #888;
      --header-bg: #1a1a1a;
      --header-text: #ffffff;
      --input-bg: #ffffff;
    }
    [data-theme="dark"] {
      --bg: #111111;
      --surface: #1e1e1e;
      --border: #2e2e2e;
      --text: #f0f0f0;
      --muted: #666;
      --header-bg: #000000;
      --header-text: #ffffff;
      --input-bg: #2a2a2a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }

    header {
      background: var(--header-bg);
      color: var(--header-text);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.1rem;
      color: #1a1a1a;
      letter-spacing: -1px;
    }

    .logo-text { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.5px; }
    .logo-sub { font-size: 0.75rem; opacity: 0.4; margin-top: 1px; }

    .header-right { display: flex; align-items: center; gap: 12px; }

    .dark-toggle {
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .dark-toggle:hover { background: rgba(255,255,255,0.2); }

    .container { max-width: 980px; margin: 0 auto; padding: 24px 16px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    @media (max-width: 600px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
    }

    .stat-card {
      background: var(--surface);
      border-radius: 12px;
      padding: 16px 20px;
      border: 1px solid var(--border);
    }

    .stat-card .label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card .value { font-size: 1.8rem; font-weight: 800; margin-top: 4px; }
    .value.green { color: #16a34a; }
    .value.yellow { color: #d97706; }
    .value.red { color: #dc2626; }
    .value.neutral { color: var(--text); }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-input {
      flex: 1;
      min-width: 180px;
      padding: 9px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.875rem;
    }
    .search-input:focus { outline: none; border-color: #1a1a1a; }
    [data-theme="dark"] .search-input:focus { border-color: #fff; }

    .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }

    .filter-btn {
      padding: 7px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.78rem;
      cursor: pointer;
      font-weight: 500;
      white-space: nowrap;
    }
    .filter-btn.active { background: #1a1a1a; color: white; border-color: #1a1a1a; }
    [data-theme="dark"] .filter-btn.active { background: white; color: #1a1a1a; border-color: white; }

    .export-btn {
      padding: 8px 16px;
      border-radius: 8px;
      background: #16a34a;
      color: white;
      border: none;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }
    .export-btn:hover { background: #15803d; }

    .refresh-btn {
      padding: 8px 16px;
      border-radius: 8px;
      background: var(--text);
      color: var(--bg);
      border: none;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
    }
    .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .section-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .card {
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 20px;
      margin-bottom: 10px;
      transition: box-shadow 0.15s;
    }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    [data-theme="dark"] .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.3); }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
    }

    .card-left { display: flex; gap: 14px; align-items: flex-start; flex: 1; min-width: 0; }

    .rank {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--border);
      min-width: 28px;
      flex-shrink: 0;
    }

    .name { font-size: 1rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .location { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
    .date { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

    .card-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge.APROBAR { background: #dcfce7; color: #16a34a; }
    .badge.REVISAR { background: #fef9c3; color: #854d0e; }
    .badge.RECHAZAR { background: #fee2e2; color: #dc2626; }

    .score-bar-wrap { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .score-bar { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .score-fill { height: 100%; border-radius: 3px; }
    .score-fill.high { background: #16a34a; }
    .score-fill.mid { background: #d97706; }
    .score-fill.low { background: #dc2626; }
    .score-num { font-size: 0.95rem; font-weight: 700; min-width: 28px; text-align: right; }

    .breakdown { margin-bottom: 16px; }
    .breakdown-title { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 600; }
    .breakdown-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .breakdown-label { font-size: 0.75rem; color: var(--muted); min-width: 90px; }
    .breakdown-bar { flex: 1; height: 4px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .breakdown-fill { height: 100%; border-radius: 3px; }
    .breakdown-num { font-size: 0.75rem; font-weight: 700; min-width: 20px; text-align: right; }

    .umbral-banner {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center;
    }
    .umbral-banner .criterio { font-size: 0.75rem; color: var(--muted); }
    .umbral-banner .criterio span { font-weight: 700; color: var(--text); }
    .umbral-banner .umbral-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-right: 4px; }

    .dias-badge { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

    .proximo-paso { margin-top: 12px; }
    .proximo-paso select {
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.8rem;
      cursor: pointer;
      width: 100%;
    }

    .detail { display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
    .detail.open { display: block; }

    .resumen { font-size: 0.88rem; color: var(--muted); line-height: 1.55; margin-bottom: 12px; }

    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .tag { font-size: 0.72rem; padding: 3px 10px; border-radius: 20px; }
    .tag.strength { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .tag.flag { background: #fff1f2; color: #be123c; border: 1px solid #fecdd3; }
    [data-theme="dark"] .tag.strength { background: #052e16; border-color: #166534; }
    [data-theme="dark"] .tag.flag { background: #4c0519; border-color: #9f1239; }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .info-item span { font-weight: 600; color: var(--text); }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }

    .action-btn {
      padding: 7px 16px;
      border-radius: 8px;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-aprobar { background: #dcfce7; color: #16a34a; }
    .btn-aprobar:hover { background: #bbf7d0; }
    .btn-rechazar { background: #fee2e2; color: #dc2626; }
    .btn-rechazar:hover { background: #fecaca; }

    .estado-select {
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.8rem;
      cursor: pointer;
    }

    .estado-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .estado-Pendiente { background: #f3f4f6; color: #6b7280; }
    .estado-Contactado { background: #dbeafe; color: #1d4ed8; }
    .estado-En\ negociación { background: #fef9c3; color: #854d0e; }
    .estado-Cerrado { background: #dcfce7; color: #16a34a; }
    [data-theme="dark"] .estado-Pendiente { background: #374151; color: #d1d5db; }
    [data-theme="dark"] .estado-Contactado { background: #1e3a5f; color: #93c5fd; }

    .notes-area {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.82rem;
      resize: vertical;
      min-height: 70px;
      font-family: inherit;
      margin-top: 8px;
    }
    .notes-area:focus { outline: none; border-color: #1a1a1a; }
    [data-theme="dark"] .notes-area:focus { border-color: #fff; }

    .notes-label { font-size: 0.75rem; color: var(--muted); font-weight: 500; }
    .save-nota-btn {
      margin-top: 6px;
      padding: 5px 12px;
      border-radius: 6px;
      background: var(--text);
      color: var(--bg);
      border: none;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .loading { text-align: center; padding: 60px; color: var(--muted); font-size: 0.9rem; }
    .empty { text-align: center; padding: 40px; color: var(--muted); font-size: 0.875rem; }

    @media (max-width: 600px) {
      .card-right { flex-direction: column; align-items: flex-end; }
      .info-grid { grid-template-columns: 1fr; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .filter-group { justify-content: flex-start; }
      .actions { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">G</div>
    <div>
      <div class="logo-text">Guchini</div>
      <div class="logo-sub">Panel de Franquicias</div>
    </div>
  </div>
  <div class="header-right">
    <button class="dark-toggle" onclick="toggleDark()">🌙 Modo oscuro</button>
  </div>
</header>

<div class="container">

  <div class="umbral-banner">
    <div><span class="umbral-title">Criterios de evaluación:</span></div>
    <div class="criterio">Capital <span>30%</span></div>
    <div class="criterio">Experiencia gastronómica <span>25%</span></div>
    <div class="criterio">Local disponible <span>20%</span></div>
    <div class="criterio">Motivación y fit <span>15%</span></div>
    <div class="criterio">Ciudad / Mercado <span>10%</span></div>
    <div class="criterio" style="margin-left:auto;">Puntaje mínimo para avanzar: <span>6.5</span></div>
  </div>

  <div class="stats" id="stats">
    <div class="stat-card"><div class="label">Total</div><div class="value neutral" id="total">—</div></div>
    <div class="stat-card"><div class="label">Aprobar</div><div class="value green" id="aprobados">—</div></div>
    <div class="stat-card"><div class="label">Revisar</div><div class="value yellow" id="revision">—</div></div>
    <div class="stat-card"><div class="label">Rechazar</div><div class="value red" id="rechazados">—</div></div>
  </div>

  <div class="toolbar">
    <input class="search-input" type="text" placeholder="Buscar por nombre o ciudad..." oninput="filterCards()" id="searchInput" />
    <div class="filter-group">
      <button class="filter-btn active" onclick="setFilter('todos', this)">Todos</button>
      <button class="filter-btn" onclick="setFilter('APROBAR', this)">Aprobar</button>
      <button class="filter-btn" onclick="setFilter('REVISAR', this)">Revisar</button>
      <button class="filter-btn" onclick="setFilter('RECHAZAR', this)">Rechazar</button>
    </div>
    <button class="export-btn" onclick="exportCSV()">⬇ Exportar Excel</button>
    <button class="refresh-btn" id="refreshBtn" onclick="refreshRanking()">↻ Actualizar evaluación</button>
  </div>

  <div class="section-title" id="resultCount"></div>
  <div id="lista"><div class="loading">Cargando evaluaciones...</div></div>

</div>

<script>
  let allData = [];
  let currentFilter = 'todos';

  async function loadRanking() {
    const res = await fetch('/api/ranking');
    allData = await res.json();
    renderRanking(allData);
  }

  async function refreshRanking() {
    const btn = document.getElementById('refreshBtn');
    btn.disabled = true;
    btn.textContent = 'Evaluando...';
    document.getElementById('lista').innerHTML = '<div class="loading">Evaluando puntajes con IA, puede tomar 20-30 segundos...</div>';
    const res = await fetch('/api/ranking/refresh', { method: 'POST' });
    allData = await res.json();
    renderRanking(allData);
    btn.disabled = false;
    btn.textContent = '↻ Recalcular';
  }

  function exportCSV() {
    window.open('/api/export/csv', '_blank');
  }

  function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterCards();
  }

  function filterCards() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    let filtered = allData;

    if (currentFilter !== 'todos') {
      filtered = filtered.filter(r => r.evaluacion.recomendacion === currentFilter);
    }

    if (query) {
      filtered = filtered.filter(r =>
        r.nombre.toLowerCase().includes(query) ||
        r.ciudad.toLowerCase().includes(query)
      );
    }

    renderFiltered(filtered);
  }

  function renderRanking(data) {
    const aprobados = data.filter(d => d.evaluacion.recomendacion === 'APROBAR').length;
    const revision = data.filter(d => d.evaluacion.recomendacion === 'REVISAR').length;
    const rechazados = data.filter(d => d.evaluacion.recomendacion === 'RECHAZAR').length;

    document.getElementById('total').textContent = data.length;
    document.getElementById('aprobados').textContent = aprobados;
    document.getElementById('revision').textContent = revision;
    document.getElementById('rechazados').textContent = rechazados;

    filterCards();
  }

  function renderFiltered(data) {
    document.getElementById('resultCount').textContent = `${data.length} aplicante${data.length !== 1 ? 's' : ''}`;

    if (data.length === 0) {
      document.getElementById('lista').innerHTML = '<div class="empty">No hay resultados para este filtro.</div>';
      return;
    }

    const globalIndex = {};
    allData.forEach((r, i) => { globalIndex[r.id] = i + 1; });

    document.getElementById('lista').innerHTML = data.map(r => {
      const e = r.evaluacion;
      const score = e.score;
      const fillClass = score >= 7 ? 'high' : score >= 5 ? 'mid' : 'low';
      const fortalezas = (e.fortalezas || []).map(f => `<span class="tag strength">${f}</span>`).join('');
      const flags = (e.red_flags || []).map(f => `<span class="tag flag">${f}</span>`).join('');
      const estado = r.estado || 'Pendiente';
      const nota = r.nota || '';
      const rank = globalIndex[r.id];
      const fecha = r.fecha_aplicacion ? new Date(r.fecha_aplicacion).toLocaleDateString('es-AR', {day:'numeric', month:'short', year:'numeric'}) : '';
      const diasDesde = r.fecha_aplicacion ? Math.floor((new Date() - new Date(r.fecha_aplicacion)) / (1000*60*60*24)) : null;

      const breakdown = e.breakdown || {};
      const dimensiones = [
        { label: 'Capital', key: 'capital' },
        { label: 'Experiencia', key: 'experiencia' },
        { label: 'Local', key: 'local' },
        { label: 'Motivación', key: 'motivacion' },
        { label: 'Ciudad', key: 'ciudad' },
      ];
      const breakdownHTML = breakdown && Object.keys(breakdown).length ? `
        <div class="breakdown">
          <div class="breakdown-title">Desglose por criterio</div>
          ${dimensiones.map(d => {
            const val = breakdown[d.key] || 0;
            const cls = val >= 7 ? 'high' : val >= 5 ? 'mid' : 'low';
            return `<div class="breakdown-row">
              <div class="breakdown-label">${d.label}</div>
              <div class="breakdown-bar"><div class="breakdown-fill ${cls}" style="width:${val*10}%"></div></div>
              <div class="breakdown-num">${val}</div>
            </div>`;
          }).join('')}
        </div>` : '';

      return `
        <div class="card" id="card-${r.id}">
          <div class="card-header" onclick="toggleDetail(${r.id})">
            <div class="card-left">
              <div class="rank">#${rank}</div>
              <div>
                <div class="name">${r.nombre}</div>
                <div class="location">${r.ciudad}</div>
                ${fecha ? `<div class="date">Aplicó: ${fecha}${diasDesde !== null ? ` · hace ${diasDesde} días` : ''}</div>` : ''}
              </div>
            </div>
            <div class="card-right">
              <span class="badge ${e.recomendacion}">${e.recomendacion}</span>
            </div>
          </div>

          <div class="score-bar-wrap">
            <div class="score-bar">
              <div class="score-fill ${fillClass}" style="width:${score*10}%"></div>
            </div>
            <div class="score-num">${score}/10</div>
          </div>

          <div class="detail" id="detail-${r.id}">
            <p class="resumen">${e.resumen}</p>
            ${breakdownHTML}
            <div class="tags">${fortalezas}${flags}</div>

            <div class="info-grid">
              <div class="info-item">Capital: <span>$${r.capital_disponible?.toLocaleString()} USD</span></div>
              <div class="info-item">Local propio: <span>${r.tiene_local ? 'Sí' : 'No'}</span></div>
              <div class="info-item">Disponibilidad: <span>${r.disponibilidad}</span></div>
              <div class="info-item">Email: <span>${r.email}</span></div>
            </div>

            <div class="actions">
              <button class="action-btn btn-aprobar" onclick="accion(${r.id}, 'aprobar')">✓ Aprobar</button>
              <button class="action-btn btn-rechazar" onclick="accion(${r.id}, 'rechazar')">✕ Rechazar</button>
              <select class="estado-select" onchange="updateEstado(${r.id}, this.value)" id="estado-${r.id}">
                <option ${estado==='Pendiente'?'selected':''}>Pendiente</option>
                <option ${estado==='Contactado'?'selected':''}>Contactado</option>
                <option ${estado==='En negociación'?'selected':''}>En negociación</option>
                <option ${estado==='Cerrado'?'selected':''}>Cerrado</option>
              </select>
            </div>

            <div class="notes-label">Notas internas</div>
            <textarea class="notes-area" id="nota-${r.id}" placeholder="Agregar comentarios sobre este aplicante...">${nota}</textarea>
            <button class="save-nota-btn" onclick="saveNota(${r.id})">Guardar nota</button>
          </div>
        </div>
      `;
    }).join('');
  }

  function toggleDetail(id) {
    document.getElementById(`detail-${id}`).classList.toggle('open');
  }

  async function accion(id, tipo) {
    const estado = tipo === 'aprobar' ? 'Contactado' : 'Pendiente';
    const select = document.getElementById(`estado-${id}`);
    if (select) select.value = estado;
    await updateEstado(id, estado);

    const r = allData.find(x => x.id === id);
    if (r) r.estado = estado;
  }

  async function updateEstado(id, estado) {
    await fetch(`/api/aplicante/${id}/estado`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ estado })
    });
    const r = allData.find(x => x.id === id);
    if (r) r.estado = estado;
  }

  async function saveNota(id) {
    const nota = document.getElementById(`nota-${id}`).value;
    await fetch(`/api/aplicante/${id}/nota`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nota })
    });
    const r = allData.find(x => x.id === id);
    if (r) r.nota = nota;
    const btn = document.querySelector(`#card-${id} .save-nota-btn`);
    if (btn) { btn.textContent = '✓ Guardado'; setTimeout(() => btn.textContent = 'Guardar nota', 1500); }
  }

  function toggleDark() {
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    document.querySelector('.dark-toggle').textContent = isDark ? '🌙 Modo oscuro' : '☀️ Modo claro';
  }

  loadRanking();
</script>
</body>
</html>
